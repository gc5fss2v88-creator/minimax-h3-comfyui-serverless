name: build-h3-blackwell
on:
  workflow_dispatch:
  push:
    paths: [Dockerfile.cu130, check_arch.py, handler.py, workflows/**, requirements-worker.txt, .github/workflows/build.yml]
jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: {contents: read, packages: write}
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: {tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, swap-storage: true}
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cu130
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minimax-h3-blackwell:cu130-code
            ghcr.io/${{ github.repository_owner }}/minimax-h3-blackwell:latest
          provenance: false
