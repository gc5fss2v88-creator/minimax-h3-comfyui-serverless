name: build-h3-sage-candidate

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.sage-candidate
      - start-serverless.sh
      - handler.py
      - profiling.py
      - workflows/h3_i2v_mxfp8_api.json
      - requirements-worker.txt
      - check_arch.py
      - .github/workflows/build-sage-candidate.yml

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions: {contents: read, packages: write}
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: {tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, swap-storage: true}
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}'}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sage-candidate
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/minimax-h3-blackwell:mxfp8-candidate-sage-code
          provenance: false
      - name: Publish immutable candidate tag
        env: {IMAGE: 'ghcr.io/${{ github.repository_owner }}/minimax-h3-blackwell'}
        run: |
          set -euo pipefail
          docker pull "$IMAGE:mxfp8-candidate-sage-code"
          docker tag "$IMAGE:mxfp8-candidate-sage-code" "$IMAGE:mxfp8-candidate-sage"
          docker push "$IMAGE:mxfp8-candidate-sage"
