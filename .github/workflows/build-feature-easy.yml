name: build-h3-feature-easy

on:
  workflow_dispatch:
  push:
    paths:
      - Dockerfile.feature-easy
      - start-feature-easy.sh
      - handler.py
      - profiling.py
      - docs/UNIFIED_API.md
      - requirements-worker.txt
      - .github/workflows/build-feature-easy.yml

jobs:
  feature:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: {contents: read, packages: write}
    steps:
      - uses: jlumbroso/free-disk-space@main
        with: {tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, swap-storage: true}
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish Easy feature image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.feature-easy
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/minimax-h3-blackwell:feature-easy-code
            ghcr.io/${{ github.repository_owner }}/minimax-h3-blackwell:feature-easy
          provenance: false

