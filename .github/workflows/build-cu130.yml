name: build-minimax-h3-image-cu130
on:
  push:
    paths: ['Dockerfile.cu130', 'check_arch.py', '.github/workflows/build-cu130.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push cu130 code image (no weights)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cu130
          push: true
          tags: ghcr.io/gc5fss2v88-creator/minimax-h3-comfyui-serverless:cu130-code
          provenance: false
      - name: Install crane
        uses: imjasonh/setup-crane@v0.4
      # Same streaming trick as the cu126 build: 42.5GB of weights cannot go through
      # buildkit's export step on a GHA runner, so each file is appended as its own
      # remote layer. Peak disk is one weight file plus its tar.
      - name: Append weight layers with crane
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq aria2
          crane auth login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"
          WORK=/mnt/weights
          sudo mkdir -p "$WORK" && sudo chown "$USER" "$WORK"
          IMG=ghcr.io/gc5fss2v88-creator/minimax-h3-comfyui-serverless
          BASE="$IMG:cu130-code"
          append() { # $1 models subdir, $2 filename, $3 url
            mkdir -p "$WORK/stage/comfyui/models/$1"
            aria2c -x16 -s16 -k1M --console-log-level=warn \
              --dir="$WORK/stage/comfyui/models/$1" -o "$2" "$3"
            tar --owner=0 --group=0 -cf "$WORK/layer.tar" -C "$WORK/stage" comfyui
            rm -rf "$WORK/stage"
            crane append -b "$BASE" -f "$WORK/layer.tar" -t "$IMG:cu130-wip"
            rm -f "$WORK/layer.tar"
            BASE="$IMG:cu130-wip"
            df -h /mnt | tail -1
          }
          append diffusion_models minimax_h3_fl2va_pruned_int8_convrot.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors
          append text_encoders qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/text_encoders/qwen3vl_32b_minimax_h3_nvfp4_awq.safetensors
          append vae minimax_h3_video_vae_fp16.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_video_vae_fp16.safetensors
          append vae minimax_h3_audio_vae_fp32.safetensors \
            https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/vae/minimax_h3_audio_vae_fp32.safetensors
          crane tag "$IMG:cu130-wip" cu130
