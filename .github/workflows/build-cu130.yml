name: build-minimax-h3-image-cu130

on:
  push:
    paths:
      - Dockerfile.cu130
      - check_arch.py
      - .github/workflows/build-cu130.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push cu130 cache image without weights
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.cu130
          push: true
          tags: ghcr.io/gc5fss2v88-creator/minimax-h3-comfyui-serverless:cu130-cache
          provenance: false
